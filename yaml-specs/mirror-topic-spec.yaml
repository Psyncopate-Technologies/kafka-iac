pipeline_version: str(required=False)
mirror_topic: include('mirror_topic_definition', required=True)
---
mirror_topic_definition:
  source_kafka_cluster: str(min=1, max=249, regex='^[a-zA-Z0-9._-]+$', required=True)
  target_kafka_cluster: str(min=1, max=249, regex='^[a-zA-Z0-9._-]+$', required=True)
  target_kafka_env: str(min=1, max=249, regex='^[a-zA-Z0-9._-]+$', required=True)
  source_topic_name: str(min=1, max=249, regex='^[a-zA-Z0-9._-]+$', required=True)
  status: enum('ACTIVE', 'PAUSED', 'PROMOTED', 'FAILED_OVER', required=True)
  delete_after_migration: bool(required=True)
